<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroScan</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
    <div class="logo">AeroScan</div>

    <div class="top-tabs">
        <button onclick="changeView('superior')">SUPERIOR</button>
        <button onclick="changeView('perfil')">PERFIL</button>
        <button onclick="changeView('frontal')">FRONTAL</button>
        <button onclick="changeView('trasera')">TRASERA</button>
    </div>
</header>

<div class="main">

    <!-- IZQUIERDA -->
    <aside class="sidebar">

        <h2>TIPO DE DAÑO</h2>

        <div class="grid-buttons">
            <button onclick="selectDamage('Grieta')">GRIETA</button>
            <button onclick="selectDamage('Abolladura')">ABOLLADURA</button>
            <button onclick="selectDamage('Corrosión')">CORROSIÓN</button>
            <button onclick="selectDamage('Fractura')">FRACTURA</button>
            <button onclick="selectDamage('Delaminación')">DELAM.</button>
            <button onclick="selectDamage('Rayadura')">RAYADURA</button>
        </div>

        <h2>SEVERIDAD</h2>

        <div class="grid-buttons">
            <button onclick="selectSeverity('Leve')">LEVE</button>
            <button onclick="selectSeverity('Moderado')">MODERADO</button>
            <button onclick="selectSeverity('Severo')">SEVERO</button>
            <button onclick="selectSeverity('Crítico')">CRÍTICO</button>
        </div>

    </aside>

    <!-- CENTRO -->
    <main class="viewer" id="viewer">

        <img id="aircraftImage" src="superior.png">

    </main>

    <!-- DERECHA -->
    <aside class="rightbar">

        <h2>REPORTES PASADOS</h2>

        <div id="reportList"></div>

        <button class="pdfButton" onclick="generatePDF()">
            GENERAR PDF
        </button>

    </aside>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Registrar Daño</h2>

        <input type="text" id="zoneInput" placeholder="Zona">

        <input type="text" id="sizeInput" placeholder="Tamaño estimado">

        <textarea id="notesInput" placeholder="Notas"></textarea>

        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">
                Cancelar
            </button>

            <button class="save-btn" onclick="saveDamage()">
                Guardar
            </button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
