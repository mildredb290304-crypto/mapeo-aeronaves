<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AeroScan</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<div class="logo">AeroScan</div>

<nav>
<button onclick="changeView('superior')">SUPERIOR</button>
<button onclick="changeView('izquierdo')">PERFIL IZQ</button>
<button onclick="changeView('derecho')">PERFIL DER</button>
<button onclick="changeView('frontal')">FRONTAL</button>
<button onclick="changeView('trasera')">TRASERA</button>
</nav>
</header>

<div class="container">

<aside class="sidebar">

<h2>TIPO DE DAÑO</h2>

<div class="damage-types">
<button>GRIETA</button>
<button>ABOLLADURA</button>
<button>CORROSIÓN</button>
<button>FRACTURA</button>
<button>DELAM.</button>
<button>RAYADURA</button>
</div>

<h2>SEVERIDAD</h2>

<div class="severity">
<button class="leve">LEVE</button>
<button class="moderado">MODERADO</button>
<button class="severo">SEVERO</button>
<button class="critico">CRÍTICO</button>
</div>

<button class="pdf-btn" onclick="generatePDF()">
GENERAR PDF
</button>

</aside>

<main>

<div class="viewer" id="viewer">

<img src="superior.png" id="aircraftImage">

</div>

</main>

<aside class="reports">

<h2>REPORTES PASADOS</h2>

<div id="reportList"></div>

</aside>

</div>

<div class="modal hidden" id="modal">

<div class="modal-content">

<h2>REGISTRAR DAÑO</h2>

<input type="text" id="part" placeholder="Parte">

<input type="text" id="size" placeholder="Tamaño">

<textarea id="notes" placeholder="Notas"></textarea>

<button onclick="saveDamage()">
GUARDAR
</button>

<button onclick="closeModal()">
CANCELAR
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
