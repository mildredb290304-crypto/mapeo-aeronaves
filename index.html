<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroScan</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo">AeroScan</div>

  <div class="status-bar">
    <span class="dot"></span>
    <span>SISTEMA ACTIVO</span>
  </div>
</header>

<div class="main-container">

  <aside class="sidebar">

    <h2>CONTROL DE DAÑOS</h2>

    <div class="section">
      <h3>SEVERIDAD</h3>

      <button class="severity low">NIVEL 1 – LEVE</button>
      <button class="severity medium">NIVEL 2 – MODERADO</button>
      <button class="severity severe">NIVEL 3 – SEVERO</button>
      <button class="severity critical">NIVEL 4 – CRÍTICO</button>
    </div>

    <div class="section">
      <h3>ZONAS</h3>

      <ul>
        <li>Fuselaje</li>
        <li>Ala izquierda</li>
        <li>Ala derecha</li>
        <li>Empenaje</li>
        <li>Nariz</li>
        <li>Cabina</li>
        <li>Tren de aterrizaje</li>
        <li>Motores</li>
      </ul>
    </div>

    <div class="section">
      <h3>RESUMEN</h3>

      <div class="stats">
        <div class="stat-box">
          <span id="damageCount">0</span>
          <p>DAÑOS</p>
        </div>

        <div class="stat-box">
          <span id="criticalCount">0</span>
          <p>CRÍTICOS</p>
        </div>
      </div>
    </div>

  </aside>

  <main class="viewer">

    <div class="viewer-title">
      VISTA GENERAL DE AERONAVE
    </div>

    <div class="aircraft-container" id="aircraftContainer">

      <img src="aircraft_views.png" id="aircraftImage">

    </div>

  </main>

  <aside class="damage-panel">

    <h2>REGISTRO DE DAÑOS</h2>

    <div id="damageList"></div>

  </aside>

</div>

<div class="modal hidden" id="damageModal">

  <div class="modal-content">

    <h2>REGISTRAR DAÑO</h2>

    <label>Parte identificada</label>
    <input type="text" id="partField" readonly>

    <label>Tamaño estimado</label>
    <input type="text" id="sizeField" placeholder="Ej. 5 cm x 3 cm">

    <label>Nivel de daño</label>
    <select id="severityField">
      <option>Leve</option>
      <option>Moderado</option>
      <option>Severo</option>
      <option>Crítico</option>
    </select>

    <label>Notas del inspector</label>
    <textarea id="notesField"></textarea>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="confirm" onclick="saveDamage()">Confirmar</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
